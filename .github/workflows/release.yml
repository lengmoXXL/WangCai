name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      agent:
        description: Publish the agent even if wangcaicli did not change
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # The app goes out on every tag. The agent goes out on its own, under the tag of its own version, and only
  # when wangcaicli changed: the shell does not carry it, so a Core downloads the version it drives from that
  # release. The app's release is the one the repository calls latest; the agent's never is.
  versions:
    runs-on: ubuntu-latest
    outputs:
      crate: ${{ steps.read.outputs.crate }}
      agent: ${{ steps.read.outputs.agent }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read the versions and decide what this run publishes
        id: read
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.agent }}
        run: |
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' wangcaicli/Cargo.toml | head -1)
          app=$(node -p "require('./desktop/package.json').version")
          echo "crate=$crate" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test "$GITHUB_REF_NAME" = "v$app" || { echo "$GITHUB_REF_NAME does not match app version $app"; exit 1; }
          fi
          previous=$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)
          changed=true
          if [ -n "$previous" ]; then
            if [ -z "$(git diff --name-only "$previous" HEAD -- wangcaicli)" ]; then changed=false; fi
            if [ "$changed" = true ]; then
              released=$(git show "$previous:wangcaicli/Cargo.toml" | sed -n 's/^version = "\(.*\)"/\1/p' | head -1)
              test "$crate" != "$released" || { echo "wangcaicli changed but its version is still $crate"; exit 1; }
            fi
          fi
          if [ "$changed" = true ] || [ "$FORCE" = true ]; then
            echo "agent=true" >> "$GITHUB_OUTPUT"
          else
            gh release view "agent-v$crate" >/dev/null 2>&1 || { echo "no agent-v$crate release for the agent this checkout builds"; exit 1; }
            echo "agent=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Open the releases this run writes into
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --latest --generate-notes
          fi
          if [ "${{ steps.read.outputs.agent }}" = true ]; then
            tag=agent-v${{ steps.read.outputs.crate }}
            gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "$tag" --target "$GITHUB_SHA" --latest=false --generate-notes
          fi

  agent:
    needs: versions
    if: needs.versions.outputs.agent == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: x86_64-apple-darwin
          - runner: macos-latest
            target: aarch64-apple-darwin
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      - name: Add the target
        run: rustup target add ${{ matrix.target }}
      - name: Build the agent
        run: cargo build --release --target ${{ matrix.target }} --manifest-path wangcaicli/Cargo.toml
      - name: Name the asset after its platform
        run: cp wangcaicli/dist/${{ matrix.target }}/release/wangcai wangcai-${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: wangcai-${{ matrix.target }}
          path: wangcai-${{ matrix.target }}
      # The app checks what it installs against this digest.
      - name: Publish the agent under the tag of its own version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset=wangcai-${{ matrix.target }}
          shasum -a 256 "$asset" | cut -d' ' -f1 > "$asset.sha256"
          gh release upload "agent-v${{ needs.versions.outputs.crate }}" "$asset" "$asset.sha256" --clobber

  app:
    needs: versions
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
          - arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the workspaces
        run: npm ci
      - name: Package the ad-hoc signed app for ${{ matrix.arch }}
        run: npm run package:mac:${{ matrix.arch }}
      - name: Check the app carries the architecture it was built for
        run: |
          want=${{ matrix.arch == 'x64' && 'x86_64' || 'arm64' }}
          app=$(ls -d desktop/dist/package/mac*/旺财.app)
          for binary in Contents/MacOS/旺财 Contents/Resources/node/bin/node; do
            got=$(lipo -archs "$app/$binary")
            test "$got" = "$want" || { echo "$binary is $got, expected $want"; exit 1; }
          done
      - name: Check the app carries no Core
        run: |
          app=$(ls -d desktop/dist/package/mac*/旺财.app)
          test ! -e "$app/Contents/Resources/core" || { echo "the app carries a Core; a start installs one instead"; exit 1; }
      # The runner is arm64, so this leg starts the app it just built; the x64 app cannot run here.
      # The app installs Core on its first start, which a test does not do, so the checkout it would build is
      # built here and handed to the tests; the release itself carries no Core.
      - name: Build the Core a first start would install
        if: matrix.arch == 'arm64'
        env:
          WANGCAI_CORE_SOURCE: ${{ runner.temp }}/core
        run: |
          git clone --depth 1 https://github.com/lengmoXXL/WangCai-Core "$WANGCAI_CORE_SOURCE"
          npm --prefix "$WANGCAI_CORE_SOURCE" install --no-audit --no-fund --no-progress
          npm --prefix "$WANGCAI_CORE_SOURCE" run build
          echo "WANGCAI_CORE_SOURCE=$WANGCAI_CORE_SOURCE" >> "$GITHUB_ENV"
      - name: Check the packaged app itself
        if: matrix.arch == 'arm64'
        env:
          WANGCAI_APP_DIR: desktop/dist/package/mac-arm64
        run: node --test tests/package.cjs
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: wangcai-mac-${{ matrix.arch }}
          path: |
            desktop/dist/package/*.dmg
            desktop/dist/package/*.zip
      - name: Publish to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" desktop/dist/package/*.dmg desktop/dist/package/*.zip --clobber
