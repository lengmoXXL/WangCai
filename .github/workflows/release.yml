name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  agent:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: x86_64-apple-darwin
          - runner: macos-latest
            target: aarch64-apple-darwin
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag against both versions
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' wangcaicli/Cargo.toml | head -1)
          app=$(node -p "require('./desktop/package.json').version")
          test "$crate" = "$app" || { echo "wangcaicli is $crate but the app is $app"; exit 1; }
          test "v$crate" = "$GITHUB_REF_NAME" || { echo "$GITHUB_REF_NAME does not match agent version $crate"; exit 1; }
      - name: Add the target
        run: rustup target add ${{ matrix.target }}
      - name: Build the agent
        run: cargo build --release --target ${{ matrix.target }} --manifest-path wangcaicli/Cargo.toml
      - name: Name the asset after its platform
        run: cp wangcaicli/dist/${{ matrix.target }}/release/wangcai wangcai-${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: wangcai-${{ matrix.target }}
          path: wangcai-${{ matrix.target }}
      - name: Publish to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" "wangcai-${{ matrix.target }}" --clobber
