[package]
name = "wangcai"
version = "0.1.4"
edition = "2024"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
futures-util = "0.3"
libc = "0.2"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "signal", "macros", "process", "io-util"] }
tokio-tungstenite = "0.28"
uuid = { version = "1", features = ["v4"] }
vt100 = "0.16"
